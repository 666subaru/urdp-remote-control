<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>URDP</title>
<link rel="stylesheet" href="tablet.css">
<script type="module" src="tablet.js"></script>
</head>
<body>
<div id="screen"></div>
<div id="panel">
  <div id="title">URDP</div>
  <div id="status"></div>
  <form id="codeform" hidden>
    <label id="codelabel" for="code"></label>
    <input id="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
    <button id="codebutton" type="submit"></button>
  </form>
  <button id="full" type="button"></button>
</div>
<button id="fullmini" type="button" hidden aria-label="Full screen">⛶</button>
</body>
</html>
